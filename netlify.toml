[build]
  command   = "npx expo export --platform web && node scripts/inject-landing-splash.mjs"
  publish   = "dist"

[build.environment]
  # google-services.json carries the Firebase *Android* API key (AIzaSy…), which
  # is a public client identifier restricted by app-signing SHA — not a secret,
  # and it is never inlined into the web bundle. Netlify's secret-scanner
  # heuristic flags the AIzaSy… shape as a likely secret and fails the deploy,
  # so whitelist that one file + value. This is NOT a blanket scan disable.
  SECRETS_SCAN_OMIT_PATHS                    = "google-services.json"
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES   = "AIzaSyBYJXQ-0jCawrckoLePESokpGBlR9sOPNE"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Expo emits content-hashed filenames under /_expo/static, so they can be
# cached forever — a new build produces new names. Makes repeat visits instant.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The big hero trailer is immutable too (fixed filename, replaced only on
# deploy); let browsers/CDN hold it so a replay doesn't re-download 24MB.
[[headers]]
  for = "/qday-trailer.mp4"
  [headers.values]
    Cache-Control = "public, max-age=604800"
